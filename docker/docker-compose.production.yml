services:
  redis-prod:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    networks:
      - shared-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: kihoonbae/binbang:web-${IMAGE_TAG}@${IMAGE_WEB_DIGEST}
    ports:
      - '4000:3000'
    networks:
      - shared-network
    env_file:
      - path: ../.env.doppler.web.production
        required: true
    environment:
      APP_ENV: production
      DOCKER_ENV: 'true'
      WORKER_INTERNAL_URL: http://worker:3500
    restart: unless-stopped

  worker:
    image: kihoonbae/binbang:worker-${IMAGE_TAG}@${IMAGE_WORKER_DIGEST}
    networks:
      - shared-network
    expose:
      - '3500'
    env_file:
      - path: ../.env.doppler.worker.production
        required: true
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis-prod:6379
      WEB_INTERNAL_URL: http://web:3000
      TRAVEL_INTERNAL_URL: http://travel:3000
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped

  travel:
    image: kihoonbae/binbang:travel-${IMAGE_TAG}@${IMAGE_TRAVEL_DIGEST}
    ports:
      - '3300:3000'
    networks:
      - shared-network
    env_file:
      - path: ../.env.doppler.travel.production
        required: true
    environment:
      APP_ENV: production
    restart: unless-stopped


networks:
  shared-network:
    driver: bridge
    external: true
    name: binbang_shared_network

volumes:
  redis-data:
