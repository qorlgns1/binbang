services:
  redis-dev:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    networks:
      - shared-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: kihoonbae/binbang:web-develop
    ports:
      - '3200:3000'
    networks:
      - shared-network
    env_file:
      - path: ../.env.doppler.web.development
        required: true
    environment:
      APP_ENV: development
      NODE_ENV: development
      DOCKER_ENV: 'true'
      WORKER_INTERNAL_URL: http://worker:3500
    restart: unless-stopped

  worker:
    image: kihoonbae/binbang:worker-develop
    networks:
      - shared-network
    env_file:
      - path: ../.env.doppler.worker.development
        required: true
    environment:
      APP_ENV: development
      NODE_ENV: development
      REDIS_URL: redis://redis-dev:6379
      WEB_INTERNAL_URL: http://web:3000
      TRAVEL_INTERNAL_URL: http://travel:3000
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped

  travel:
    image: kihoonbae/binbang:travel-develop
    ports:
      - '3301:3000'
    networks:
      - shared-network
    env_file:
      - path: ../.env.doppler.travel.development
        required: true
    environment:
      APP_ENV: development
      NODE_ENV: development
    restart: unless-stopped


networks:
  shared-network:
    driver: bridge
    external: true
    name: binbang_shared_network

volumes:
  redis-data:
